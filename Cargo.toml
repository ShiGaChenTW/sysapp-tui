[package]
name = "sysapp-tui"
version = "0.2.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
ratatui = "0.30"
crossterm = "0.29"
tears = "0.10"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
unicode-width = "0.2.2"
futures = "0.3.33"
