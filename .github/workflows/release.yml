name: release

# Tagging `v*` builds macOS binaries and publishes them as a GitHub release.
# The Homebrew formula points at these artifacts, so the tag is the only
# manual step in shipping a version.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: macos-14
    strategy:
      matrix:
        include:
          # Apple Silicon is the primary target; x86_64 is cross-compiled from
          # the same runner so Intel Macs are not left behind.
          - target: aarch64-apple-darwin
          - target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Test
        # Only on the native target — the cross-compiled binary cannot run here.
        if: matrix.target == 'aarch64-apple-darwin'
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          set -euo pipefail
          NAME="sysapp-tui-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$NAME"
          cp "target/${{ matrix.target }}/release/sysapp-tui" "dist/$NAME/"
          cp README.md README-ZH.md "dist/$NAME/"
          tar -czf "dist/$NAME.tar.gz" -C dist "$NAME"
          shasum -a 256 "dist/$NAME.tar.gz" | tee "dist/$NAME.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Show checksums
        # Printed into the job log so the formula's sha256 values can be
        # copied from a build record rather than recomputed by hand.
        run: cat dist/*.sha256

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          generate_release_notes: true
